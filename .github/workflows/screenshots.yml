name: Screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Tangkapan layar UI (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK & APK androidTest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Boot emulator manual dengan gerbang kesiapan — alasan sama dengan
      # e2e.yml (action pihak ketiga menjalankan `input keyevent 82` tanpa
      # retry tepat setelah boot_completed; pada boot lambat layanan `input`
      # belum terpublish dan job gagal).
      - name: Buat & boot emulator (tunggu layanan sistem siap)
        run: |
          # sdkmanager/avdmanager tidak ada di PATH default runner — tambahkan.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # avdmanager & emulator lama menulis/membaca AVD di lokasi berbeda
          # (asimetri XDG) -> pin eksplisit agar konsisten.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager --install "system-images;android-30;aosp_atd;x86_64" > /dev/null
          echo no | avdmanager create avd --force -n test \
            --device pixel \
            --package 'system-images;android-30;aosp_atd;x86_64'
          test -f "$ANDROID_AVD_HOME/test.ini" || { echo "AVD tidak ditemukan:"; ls -laR "$HOME/.android" "$HOME/.config/.android" 2>/dev/null; exit 1; }
          # Image runner 26.04 tidak memberi akses /dev/kvm ke user runner.
          # Coba beri izin; bila tetap gagal, fallback ke TCG (-accel off,
          # persis perilaku android-emulator-runner, boot lebih lambat).
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM tersedia — hardware acceleration aktif."
          else
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM diaktifkan via chmod 666."
            else
              echo "KVM tidak tersedia — fallback ke TCG (boot lambat)."
              ACCEL="-accel off"
            fi
          fi
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window \
            -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot \
            $ACCEL > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator mati lebih awal — log:"; tail -40 /tmp/emulator.log; exit 1
            fi
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ] \
               && adb shell service check input 2>/dev/null | tr -d '\r' | grep -q ': found' \
               && adb shell service check settings 2>/dev/null | tr -d '\r' | grep -q ': found'; then
              echo "Emulator siap penuh (boot_completed + layanan input/settings aktif)."
              break
            fi
            sleep 5
          done
          if [ $SECONDS -ge $deadline ]; then
            echo "TIMEOUT menunggu emulator — log:"; tail -40 /tmp/emulator.log; exit 1
          fi
          adb shell input keyevent 82 || true   # best-effort, tidak fatal
          # Diagnostik rendering: PNG ini harus berisi launcher (bukan hitam).
          adb exec-out screencap -p > /tmp/boot-screen.png || true

      # Tanpa instalasi manual APK — AGP/UTP yang memasang (instalasi manual
      # konflik dengan AGP; lihat komentar di e2e.yml). Akses semua berkas
      # diberikan dari dalam instrumentasi lewat StorageAccessRule.
      # Test berjalan hanya ScreenshotTest (filter class) dengan argumen
      # instrumentation screenshots=true; hasil PNG di /sdcard/MyExplorerScreenshots.
      - name: Ambil screenshot di emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.myexplorer.app.ScreenshotTest \
            -Pandroid.testInstrumentationRunnerArguments.screenshots=true \
            --stacktrace
          adb pull /sdcard/MyExplorerScreenshots ./screenshots
          test "$(find screenshots -name '*.png' | wc -l)" -ge 12

      - name: Upload tangkapan layar (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload log & laporan (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-debug
          path: |
            /tmp/emulator.log
            /tmp/boot-screen.png
            **/build/outputs/androidTest-results/
          retention-days: 7
