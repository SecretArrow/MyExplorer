name: Screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Tangkapan layar UI (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK & APK androidTest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Boot emulator manual dengan gerbang kesiapan — alasan sama dengan
      # e2e.yml (action pihak ketiga menjalankan `input keyevent 82` tanpa
      # retry tepat setelah boot_completed; pada boot lambat layanan `input`
      # belum terpublish dan job gagal).
      - name: Buat & boot emulator (gerbang render + layanan sistem)
        run: |
          # sdkmanager/avdmanager tidak ada di PATH default runner — tambahkan.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # avdmanager & emulator lama menulis/membaca AVD di lokasi berbeda
          # (asimetri XDG) -> pin eksplisit agar konsisten.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME" /tmp/diag
          # Image runner 26.04 tidak memberi akses /dev/kvm ke user runner.
          # Coba beri izin; bila tetap gagal, fallback ke TCG (-accel off).
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM tersedia — hardware acceleration aktif."
          else
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM diaktifkan via chmod 666."
            else
              echo "KVM tidak tersedia — fallback ke TCG (boot lambat)."
              ACCEL="-accel off"
            fi
          fi

          # Kombinasi (image|flags) dicoba berurutan. Latar belakang: backend
          # gfxstream emulator 37.x + SwiftShader menghasilkan frame HITAM penuh
          # di runner ini (screencap launcher maupun app solid satu warna);
          # issuetracker 259111479: tanpa flag -gpu screenshot bekerja, dan
          # image API lebih baru membawa stack guest yang benar.
          DEFAULT_IMG="system-images;android-30;aosp_atd;x86_64"
          COMBOS=(
            "|"
            "system-images;android-33;aosp_atd;x86_64|"
            "system-images;android-33;aosp_atd;x86_64|-gpu swiftshader_indirect"
          )

          CUR_IMAGE=""
          ensure_image() {
            local img="${1:-$DEFAULT_IMG}"
            if [ "$img" != "$CUR_IMAGE" ]; then
              sdkmanager --install "$img" > /dev/null
              echo no | avdmanager create avd --force -n test --device pixel --package "$img"
              test -f "$ANDROID_AVD_HOME/test.ini" || { echo "AVD tidak ditemukan untuk $img"; exit 1; }
              CUR_IMAGE="$img"
            fi
          }

          boot_and_check() {
            local flags="$1"
            "$ANDROID_HOME/emulator/emulator" -avd test -no-window -noaudio \
              -no-boot-anim -no-snapshot $ACCEL $flags > /tmp/emulator.log 2>&1 &
            EMU_PID=$!
            local deadline=$((SECONDS + 420))
            while [ $SECONDS -lt $deadline ]; do
              if ! kill -0 "$EMU_PID" 2>/dev/null; then
                echo "Emulator mati lebih awal (mode: '$flags') — log:"; tail -20 /tmp/emulator.log
                return 1
              fi
              local boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot" = "1" ] \
                 && adb shell service check input 2>/dev/null | tr -d '\r' | grep -q ': found' \
                 && adb shell service check settings 2>/dev/null | tr -d '\r' | grep -q ': found'; then
                adb shell input keyevent 82 || true
                sleep 5
                # Diagnostik komposisi (diunggah pada artifact saat gagal).
                adb shell dumpsys SurfaceFlinger --list > /tmp/diag/sf-layers.txt 2>&1 || true
                adb logcat -d -t 800 > /tmp/diag/logcat.txt 2>&1 || true
                adb exec-out screencap -p > /tmp/diag/boot-screen.png || true
                # Uji render menentukan: foreground-kan Settings (UI berwarna);
                # kalau tangkapan tetap solid -> komposisi memang rusak.
                adb shell am start -a android.settings.SETTINGS >/dev/null 2>&1 || true
                sleep 6
                adb exec-out screencap -p > /tmp/diag/settings-screen.png || true
                local size=$(stat -c%s /tmp/diag/settings-screen.png 2>/dev/null || echo 0)
                if [ "$size" -gt 30000 ]; then
                  echo "Render OK (image: $CUR_IMAGE, mode: '$flags', Settings $size B) — emulator siap."
                  return 0
                fi
                echo "Image=$CUR_IMAGE flags='$flags': layar Settings solid ($size B) — coba berikutnya."
                return 1
              fi
              sleep 5
            done
            echo "TIMEOUT boot (image: $CUR_IMAGE, mode: '$flags') — log:"; tail -20 /tmp/emulator.log
            return 1
          }

          GPU_OK=0
          for COMBO in "${COMBOS[@]}"; do
            IMG="${COMBO%%|*}"
            FLAGS="${COMBO#*|}"
            ensure_image "$IMG"
            if boot_and_check "$FLAGS"; then GPU_OK=1; break; fi
            kill "$EMU_PID" 2>/dev/null || true
            wait "$EMU_PID" 2>/dev/null || true
            sleep 3
          done
          if [ "$GPU_OK" != "1" ]; then
            echo "Semua kombinasi image/GPU gagal render — log terakhir:"; tail -50 /tmp/emulator.log
            exit 1
          fi

      # Tanpa instalasi manual APK — AGP/UTP yang memasang (instalasi manual
      # konflik dengan AGP; lihat komentar di e2e.yml). Akses semua berkas
      # diberikan dari dalam instrumentasi lewat StorageAccessRule.
      # Test berjalan hanya ScreenshotTest (filter class) dengan argumen
      # instrumentation screenshots=true; hasil PNG di /sdcard/MyExplorerScreenshots.
      - name: Ambil screenshot di emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.myexplorer.app.ScreenshotTest \
            -Pandroid.testInstrumentationRunnerArguments.screenshots=true \
            --stacktrace
          adb pull /sdcard/MyExplorerScreenshots ./screenshots
          test "$(find screenshots -name '*.png' | wc -l)" -ge 12

      - name: Upload tangkapan layar (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload log & laporan (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-debug
          path: |
            /tmp/emulator.log
            /tmp/diag/
            **/build/outputs/androidTest-results/
          retention-days: 7
