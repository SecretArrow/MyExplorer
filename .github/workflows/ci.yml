name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ktlint + Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint check (gaya kode)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Upload laporan lint (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/lint-results*.html
          retention-days: 7

  unit-test:
    name: Unit Tests (semua modul)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Jalankan unit test
        run: ./gradlew test --stacktrace

      - name: Upload laporan test (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Task 15: pastikan baseline profile benar-benar terpaket. AGP TIDAK
      # memasukkan art profile ke APK debuggable, jadi verifikasi dilakukan
      # pada APK release unsigned (build tanpa env signing = unsigned).
      # Splits ABI aktif → assembleRelease menghasilkan 5 APK; baseline wajib
      # terpaket di SEMUA output (4 per-ABI + universal).
      - name: Verifikasi baseline profile terpaket (semua APK release unsigned)
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          GAGAL=0
          for APK in app/build/outputs/apk/release/*.apk; do
            if unzip -l "$APK" | grep -q "assets/dexopt/baseline.prof"; then
              echo "OK: baseline.prof ada dalam $APK"
            else
              echo "GAGAL: baseline.prof tidak ditemukan dalam $APK"
              unzip -l "$APK" | grep -i "dexopt" || true
              GAGAL=1
            fi
          done
          exit $GAGAL

      # Splits ABI: deteksi dini di main (sebelum workflow Release) bahwa output
      # tepat 5 APK unsigned — armeabi-v7a, arm64-v8a, x86, x86_64 + universal.
      - name: Pastikan split per ABI menghasilkan tepat 5 APK
        run: |
          ls -1 app/build/outputs/apk/release/
          for ABI in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            if [ ! -f "app/build/outputs/apk/release/app-$ABI-release-unsigned.apk" ]; then
              echo "::error::APK $ABI tidak ditemukan"
              exit 1
            fi
          done
          JUMLAH=$(ls app/build/outputs/apk/release/*.apk | wc -l)
          echo "Jumlah APK release unsigned: $JUMLAH"
          test "$JUMLAH" -eq 5

      - name: Upload APK debug
        uses: actions/upload-artifact@v7
        with:
          name: MyExplorer-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  auto-tag:
    name: Auto release ([release] di pesan commit)
    needs: [lint, unit-test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buat & dorong tag versi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            VERSION="v0.$GITHUB_RUN_NUMBER.0"
          fi
          git config user.name "myexplorer-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag "$VERSION"
          # GITHUB_TOKEN tidak memicu workflow lain; gunakan RELEASE_TOKEN (PAT)
          # agar tag otomatis men-trigger workflow Release.
          if [ -n "$RELEASE_TOKEN" ]; then
            git push "https://x-access-token:$RELEASE_TOKEN@github.com/SecretArrow/MyExplorer.git" "$VERSION"
          else
            git push origin "$VERSION"
            echo "PERHATIAN: RELEASE_TOKEN belum diisi -> tag tidak memicu Release otomatis."
          fi
          echo "Tag rilis dibuat: $VERSION"
