name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Anti dobel-run (mis. dispatch manual + trigger tag hampir bersamaan):
  # run baru pada ref yang sama membatalkan run lama yang masih berjalan.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Info-ZIP `unzip` di runner TIDAK bisa membuka zip AES-256, jadi
      # ekstraksi wajib lewat pyzipper. Keystore dikeluarkan ke RUNNER_TEMP
      # (di luar workspace, tidak ikut artefak/commit) dengan nama tetap
      # myexplorer-release.jks; nama asli di dalam zip boleh apa pun
      # (.jks / .keystore).
      - name: Siapkan keystore dari key-sign-apk.zip
        env:
          KEY_ZIP_PASSWORD: ${{ secrets.KEY_ZIP_PASSWORD }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fallback --break-system-packages: pip sistem di ubuntu-24.04
          # (PEP 668) menolak instalasi tanpa flag tersebut.
          pip3 install --quiet pyzipper || pip3 install --quiet --break-system-packages pyzipper
          python3 - <<'EOF'
          import os, pyzipper
          pwd = os.environ['KEY_ZIP_PASSWORD'].encode()
          with pyzipper.AESZipFile('key-sign-apk.zip') as z:
              z.setpassword(pwd)
              names = z.namelist()
              jks = [n for n in names if n.endswith('.jks') or n.endswith('.keystore')]
              assert jks, f'tidak ada keystore (.jks/.keystore) dalam zip: {names}'
              target = os.path.join(os.environ['RUNNER_TEMP'], 'myexplorer-release.jks')
              with open(target, 'wb') as f:
                  f.write(z.read(jks[0]))
              print('terekstrak:', jks[0], '->', target)
          EOF
          JKS="$RUNNER_TEMP/myexplorer-release.jks"
          test -s "$JKS"
          {
            echo "RELEASE_STORE_FILE=$JKS"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # Verifikasi wajib: SEMUA APK split rilis HARUS ditandatangani keystore
      # rilis (bukan hanya satu). Splits ABI menghasilkan 5 APK (4 per-ABI +
      # universal); fingerprint SHA-256 tiap APK dicocokkan dengan keystore.
      # Jika ada yang tidak cocok (mis. build unsigned karena env signing
      # tidak terbaca), step ini gagal dan Release tidak dibuat.
      - name: Verifikasi tanda tangan semua APK split (fingerprint keystore == APK)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER"
          sidik_jks=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$RELEASE_STORE_FILE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | grep -m1 -i "SHA256:" | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$sidik_jks"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            APK="app/build/outputs/apk/release/app-$ABI-release.apk"
            if [ ! -f "$APK" ]; then
              echo "::error::APK $ABI tidak ditemukan: $APK"
              ls -1 app/build/outputs/apk/release/ || true
              exit 1
            fi
            "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
            sidik_apk=$(grep -m1 -i "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | sed 's/.*digest:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
            if [ -z "$sidik_apk" ] || [ "$sidik_jks" != "$sidik_apk" ]; then
              echo "::error::$APK tidak bertanda tangan keystore rilis (jks='$sidik_jks' apk='$sidik_apk')"
              exit 1
            fi
            echo "OK: $APK ditandatangani keystore rilis ($sidik_apk)"
          done

      - name: Bersihkan keystore
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks "$RUNNER_TEMP/certs.txt"

      - name: Tentukan nama tag release
        id: rel
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.0.0-run$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Tag rilis harus cocok dengan versionName di dalam APK — dibandingkan,
      # bukan diasumsikan, supaya rilis v1.1.0 tidak menerbitkan APK "1.0.0".
      # Hanya diberlakukan pada pemicu tag; dispatch dari cabang = uji build.
      - name: Pastikan tag == versionName + kumpulkan artefak
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          VERSI=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSI" != "$TAG" ]; then
            echo "::error::tag '$TAG' tidak cocok dengan versionName '$VERSI' (harusnya v$VERSI)"
            exit 1
          fi
          mkdir -p dist
          for ABI in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$ABI-release.apk" "dist/MyExplorer-$TAG-$ABI.apk"
          done
          cp app/build/outputs/bundle/release/*.aab "dist/MyExplorer-$TAG.aab"
          ls -la dist/

      - name: Buat GitHub Release + changelog otomatis
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: My Explorer ${{ steps.rel.outputs.tag }}
          body: |
            Rilis APK **signed + split per ABI** — pilih sesuai arsitektur perangkat:

            - `arm64-v8a` — ponsel/tablet ARM 64-bit (mayoritas perangkat modern)
            - `armeabi-v7a` — perangkat ARM 32-bit lama
            - `x86_64` — emulator, Chromebook, PC 64-bit
            - `x86` — perangkat x86 32-bit
            - `universal` — semua arsitektur dalam satu APK (paling besar; pakai ini bila ragu)

            Tanda tangan keystore rilis pada **setiap** APK sudah diverifikasi otomatis oleh CI
            (fingerprint SHA-256 dicocokkan dengan keystore sebelum Release terbit).
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
