name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Instrumented Tests (emulator Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK & APK androidTest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Boot emulator secara manual (tanpa action pihak ketiga). Alasan:
      # android-emulator-runner menjalankan `input keyevent 82` tepat setelah
      # sys.boot_completed=1 TANPA retry — pada boot yang lambat layanan `input`
      # belum terpublish ("No service published for: input") dan seluruh job
      # gagal. Gerbang kesiapan di bawah menunggu boot_completed DAN layanan
      # input/settings benar-benar aktif sebelum lanjut.
      - name: Buat & boot emulator (tunggu layanan sistem siap)
        run: |
          # sdkmanager/avdmanager tidak ada di PATH default runner — tambahkan.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # avdmanager & emulator lama menulis/membaca AVD di lokasi berbeda
          # (asimetri XDG) -> pin eksplisit agar konsisten.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager --install "system-images;android-30;aosp_atd;x86_64" > /dev/null
          echo no | avdmanager create avd --force -n test \
            --device pixel \
            --package 'system-images;android-30;aosp_atd;x86_64'
          test -f "$ANDROID_AVD_HOME/test.ini" || { echo "AVD tidak ditemukan:"; ls -laR "$HOME/.android" "$HOME/.config/.android" 2>/dev/null; exit 1; }
          # Image runner 26.04 tidak memberi akses /dev/kvm ke user runner.
          # Coba beri izin; bila tetap gagal, fallback ke TCG (-accel off,
          # persis perilaku android-emulator-runner, boot lebih lambat).
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM tersedia — hardware acceleration aktif."
          else
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM diaktifkan via chmod 666."
            else
              echo "KVM tidak tersedia — fallback ke TCG (boot lambat)."
              ACCEL="-accel off"
            fi
          fi

          # Backend gfxstream bawaan emulator 37.x + SwiftShader terbukti
          # menghasilkan frame hitam penuh (bug koordinasi guest/host; screencap
          # launcher pun hitam). Coba mode berurutan sampai tangkapan layar boot
          # benar-benar berisi konten — PNG solid 1080x1920 ~13 KB, konten nyata
          # jauh lebih besar (> 30 KB).
          GPU_MODES=(
            "-gpu swiftshader_indirect -feature -GfxStream"
            "-gpu guest"
            "-gpu swiftshader_indirect"
          )
          boot_and_check() {
            local flags="$1"
            "$ANDROID_HOME/emulator/emulator" -avd test -no-window -noaudio \
              -no-boot-anim -no-snapshot $ACCEL $flags > /tmp/emulator.log 2>&1 &
            EMU_PID=$!
            local deadline=$((SECONDS + 420))
            while [ $SECONDS -lt $deadline ]; do
              if ! kill -0 "$EMU_PID" 2>/dev/null; then
                echo "Emulator mati lebih awal (mode: $flags) — log:"; tail -20 /tmp/emulator.log
                return 1
              fi
              local boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot" = "1" ] \
                 && adb shell service check input 2>/dev/null | tr -d '\r' | grep -q ': found' \
                 && adb shell service check settings 2>/dev/null | tr -d '\r' | grep -q ': found'; then
                adb shell input keyevent 82 || true   # buka keyguard bila ada
                sleep 8                               # beri waktu compositor merender
                adb exec-out screencap -p > /tmp/boot-screen.png || true
                local size=$(stat -c%s /tmp/boot-screen.png 2>/dev/null || echo 0)
                if [ "$size" -gt 30000 ]; then
                  echo "Render OK (mode: $flags, boot-screen $size B) — emulator siap."
                  return 0
                fi
                echo "Mode '$flags': layar solid/hitam ($size B) — coba mode berikutnya."
                return 1
              fi
              sleep 5
            done
            echo "TIMEOUT boot (mode: $flags) — log:"; tail -20 /tmp/emulator.log
            return 1
          }

          GPU_OK=0
          for FLAGS in "${GPU_MODES[@]}"; do
            if boot_and_check "$FLAGS"; then GPU_OK=1; break; fi
            kill "$EMU_PID" 2>/dev/null || true
            wait "$EMU_PID" 2>/dev/null || true
            sleep 3
          done
          if [ "$GPU_OK" != "1" ]; then
            echo "Semua mode GPU gagal render — log terakhir:"; tail -50 /tmp/emulator.log
            exit 1
          fi

      # PENTING: JANGAN memasang APK manual! Instalasi manual terbukti konflik
      # dengan instalasi AGP/UTP (INSTALL_FAILED_UPDATE_INCOMPATIBLE, signature)
      # yang DITELAN UTP sebagai BUILD SUCCESSFUL — akibatnya test instrumented
      # app tidak pernah benar-benar berjalan (false green, run #4–#8). AGP
      # memasang app APK + test APK sendiri; izin akses semua berkas diberikan
      # dari dalam instrumentasi lewat StorageAccessRule (ClassRule, appops via
      # UiAutomation) sebelum aktivitas diluncurkan.
      - name: Jalankan test di emulator
        run: |
          # ScreenshotTest DIKECUALIKAN: milik workflow Screenshots. Tanpa
          # notClass, asumsi @Before-nya (tanpa arg screenshots=true) dicatat
          # UTP sebagai failure — bukan skip — sehingga e2e selalu merah.
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.myexplorer.app.ScreenshotTest \
            --stacktrace
          python3 tools/verify_e2e.py

      - name: Upload laporan e2e (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            /tmp/emulator.log
            /tmp/boot-screen.png
          retention-days: 7
